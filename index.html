<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Menu</title>
<style>
  :root { --fg:#1d1d1f; --muted:#6e6e73; --line:#e3e3e8; --bg:#f6f6f8; --card:#fff; --accent:#b3261e; --chip:#ececf0; --on:#1d1d1f; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f2f2f5; --muted:#a1a1a8; --line:#34343a; --bg:#111113; --card:#1c1c20; --chip:#2a2a30; --on:#f2f2f5; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--fg); background:var(--bg); }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 12px 8px; }
  h1 { font-size:20px; margin:0 0 8px; }
  main { padding:8px 12px 40px; max-width:820px; margin:0 auto; }
  .row { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .row::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:0; border-radius:999px; padding:6px 12px; background:var(--chip); color:var(--fg); font:inherit; font-size:14px; cursor:pointer; white-space:nowrap; }
  .chip[aria-pressed="true"] { background:var(--on); color:var(--bg); }
  .chip.hide[aria-pressed="true"] { background:var(--accent); color:#fff; }
  input[type=search] { width:100%; margin:6px 0 2px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font:inherit; background:var(--card); color:var(--fg); }
  details.filters > summary { font-size:14px; color:var(--muted); cursor:pointer; margin-top:4px; }
  .label { font-size:12px; color:var(--muted); margin:8px 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  details.venue { background:var(--card); border:1px solid var(--line); border-radius:14px; margin:10px 0; overflow:hidden; }
  details.venue > summary { font-weight:650; font-size:18px; padding:12px 14px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; }
  details.venue > summary::-webkit-details-marker, details.item > summary::-webkit-details-marker { display:none; }
  details.venue > summary .n { color:var(--muted); font-weight:400; font-size:14px; }
  .cat { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; padding:10px 14px 2px; }
  details.item { border-top:1px solid var(--line); }
  details.item > summary { padding:10px 14px; cursor:pointer; list-style:none; display:flex; gap:10px; align-items:baseline; }
  details.item > summary .name { flex:1; }
  details.item > summary .price { color:var(--muted); white-space:nowrap; }
  details.item[open] > summary { background:var(--chip); }
  .body { padding:10px 14px 14px; font-size:14px; }
  .body img { width:100%; max-width:360px; border-radius:10px; display:block; margin-bottom:8px; }
  .tags { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .tag { font-size:12px; border-radius:6px; padding:2px 6px; background:#e3f1e5; color:#1b5e20; }
  .tag.a { background:#fde8e6; color:#8c1d18; }
  @media (prefers-color-scheme: dark) { .tag { background:#1f3a24; color:#bfe5c4; } .tag.a { background:#4a1f1c; color:#ffd2cd; } }
  .mini { font-size:11px; color:var(--muted); margin-left:4px; }
  .note { color:var(--muted); font-style:italic; margin:4px 0; }
  table.macros { border-collapse:collapse; margin:6px 0; font-size:13px; }
  table.macros td { padding:2px 12px 2px 0; }
  .ingr { color:var(--fg); margin-top:6px; }
  .ingr b, .ingr strong { font-weight:600; }
  .ingr i, .ingr em { color:var(--muted); }
  details.venue.far { opacity:.8; border-style:dashed; }
  .farbadge { font-size:12px; font-weight:500; color:var(--muted); background:var(--chip); border-radius:6px; padding:2px 6px; margin-left:8px; vertical-align:middle; }
  .fardiv { font-size:13px; color:var(--muted); text-align:center; margin:22px 0 4px; display:flex; gap:10px; align-items:center; }
  .fardiv::before, .fardiv::after { content:''; flex:1; border-top:1px solid var(--line); }
  .closed { padding:12px 14px; color:var(--accent); font-weight:600; }
  .empty { color:var(--muted); padding:20px 0; text-align:center; }
  footer { color:var(--muted); font-size:12px; text-align:center; margin-top:20px; }
  #lock { max-width:360px; margin:18vh auto; padding:24px; background:var(--card); border:1px solid var(--line); border-radius:16px; text-align:center; }
  #lock input { width:100%; padding:10px; font:inherit; border:1px solid var(--line); border-radius:10px; margin:10px 0; background:var(--bg); color:var(--fg); }
  #lock button { width:100%; padding:10px; font:inherit; border:0; border-radius:10px; background:var(--on); color:var(--bg); cursor:pointer; }
  #lock .err { color:var(--accent); min-height:1.4em; font-size:14px; }
</style>
</head>
<body>
<form id="lock">
  <h1>Menu</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
  <button type="submit">Open</button>
  <div class="err" id="err"></div>
</form>
<div id="app" hidden></div>

// ---------- unlock (PBKDF2-SHA256 -> AES-256-CBC + HMAC-SHA256, gzip inside) ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u => btoa(String.fromCharCode(...u));
const KEY_STORE = 'menu-key';

async function openWith(keyBytes) {
  const iv = b64(PAYLOAD.iv), ct = b64(PAYLOAD.ct), mac = b64(PAYLOAD.mac);
  const macKey = await crypto.subtle.importKey('raw', keyBytes.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
  if (!await crypto.subtle.verify('HMAC', macKey, mac, signed)) return null;
  const encKey = await crypto.subtle.importKey('raw', keyBytes.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, encKey, ct);
  const text = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(text);
}
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' }, base, 512);
  return new Uint8Array(bits);
}
async function start() {
  const saved = JSON.parse(localStorage.getItem(KEY_STORE) || 'null');
  if (saved && saved.salt === PAYLOAD.salt) {
    try { const data = await openWith(b64(saved.key)); if (data) return show(data); } catch (e) { console.warn(e); }
    localStorage.removeItem(KEY_STORE);
  }
  document.getElementById('lock').onsubmit = async ev => {
    ev.preventDefault();
    const err = document.getElementById('err');
    err.textContent = 'Opening...';
    try {
      const key = await derive(document.getElementById('pw').value);
      const data = await openWith(key);
      if (!data) { err.textContent = 'Wrong password.'; return; }
      localStorage.setItem(KEY_STORE, JSON.stringify({ salt: PAYLOAD.salt, key: toB64(key) }));
      show(data);
    } catch (e) { console.warn(e); err.textContent = 'Could not open: ' + e.message; }
  };
}

const CATS = ['Entrée', 'Sandwich', 'Composed Bagel', 'Daily Special', "Chef's Special", 'Side', 'Composed Sandwich', 'Composed Salad', 'Soup',
  'Garnish', 'Dessert', 'Gelato', 'Sorbetto', 'Bread', 'Pastry', 'Sauce', 'Chips', 'Soda', 'Bagel', 'Schmear'];
const DIETS = [['cr24b_vegetarian_x003f_', 'Vegetarian'], ['cr24b_vegan_x003f_', 'Vegan'], ['cr24b_pescatarian', 'Pescatarian'],
  ['cr24b_halal_x0020_protein', 'Halal Protein'], ['cr24b_nutritionally_x0020_focused', 'Nutritionally Focused'],
  ['cr24b_sodium_x0020_conscious', 'Sodium Conscious'], ['cr24b_local', 'Local']];
const ALLERGENS = [['cr24b_peanut', 'Peanut'], ['cr24b_tree_x0020_nut', 'Tree Nut'], ['cr24b_fish', 'Fish'], ['cr24b_crustacean', 'Crustacean'],
  ['cr24b_egg', 'Egg'], ['cr24b_milk', 'Milk'], ['cr24b_soy', 'Soy'], ['cr24b_wheat', 'Wheat/Gluten'], ['cr24b_sesame', 'Sesame'],
  ['cr24b_pork', 'Pork'], ['cr24b_beef', 'Beef'], ['cr24b_mollusk', 'Mollusk'], ['cr24b_alcohol', 'Alcohol']];
const MACROS = [['cr24b_calories', 'Calories', ''], ['cr24b_fat_x0020__x0028_grams_x0029_', 'Fat', 'g'],
  ['cr24b_saturated_x0020_fat_x0020__x0028', 'Saturated fat', 'g'], ['cr24b_carbs_x0020__x0028_grams_x0029_', 'Carbs', 'g'],
  ['cr24b_fiber_x0020__x0028_grams_x0029_', 'Fiber', 'g'], ['cr24b_total_x0020_sugars_x0020__x0028_', 'Total sugars', 'g'],
  ['cr24b_added_x0020_sugars_x0020__x0028_', 'Added sugars', 'g'], ['cr24b_protein_x0020__x0028_grams_x0029', 'Protein', 'g'],
  ['cr24b_sodium_x0020__x0028_est_x002e__x', 'Sodium (est.)', 'mg']];
const SPICY = 'cr24b_spicy_x0020__x0028_0_x002d_7_x00';

function build(rows) {
  const now = new Date(); const ymd = new Date(now.getTime() - now.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const horizon = new Date(now.getTime() + 60 * 864e5).toISOString().slice(0, 10);  // skips placeholder dates like 2040
  const byDate = new Map(), seen = new Set();
  for (const r of rows) {
    const date = String(r.ds39818_date || '').slice(0, 10);
    if (!date || date < ymd || date > horizon) continue;
    if (!r.cr24b_item && !/^CLOSED/i.test(r.cr24b_title || '')) continue;
    for (const [flag, venue] of VENUES) {
      if (!r[flag]) continue;
      const key = date + '|' + venue + '|' + (r.cr24b_item || r.cr24b_title);
      if (seen.has(key)) continue; seen.add(key);
      if (!byDate.has(date)) byDate.set(date, []);
      byDate.get(date).push({ venue, r });
    }
  }
  return { dates: [...byDate.keys()].sort(), byDate, today: ymd };
}

// ---------- rendering ----------
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
};
const ALLOWED = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'BR', 'P', 'DIV', 'SPAN', 'UL', 'OL', 'LI', 'SUP', 'SUB']);
function safeHtml(html) {  // keep basic formatting only; drop every attribute and any other tag
  const doc = new DOMParser().parseFromString(String(html), 'text/html');
  const walk = node => {
    for (const c of [...node.childNodes]) {
      if (c.nodeType === 1) {
        if (!ALLOWED.has(c.tagName)) { if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE)$/.test(c.tagName)) c.remove(); else { walk(c); c.replaceWith(...c.childNodes); } continue; }
        for (const a of [...c.attributes]) c.removeAttribute(a.name);
        walk(c);
      } else if (c.nodeType !== 3) c.remove();
    }
  };
  walk(doc.body);
  const frag = document.createDocumentFragment();
  frag.append(...doc.body.childNodes);
  return frag;
}
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const num = v => v === null || v === undefined || v === '' ? null : Number(v);

const state = Object.assign({ date: null, venues: [], diets: [], hide: [], q: '' }, JSON.parse(localStorage.getItem('menu-filters') || '{}'));
const save = () => localStorage.setItem('menu-filters', JSON.stringify({ venues: state.venues, diets: state.diets, hide: state.hide }));

function itemView(x) {
  const r = x.r;
  const spice = num(r[SPICY]) || 0;
  const diets = DIETS.filter(d => r[d[0]]).map(d => d[1]);
  const contains = ALLERGENS.filter(a => r[a[0]]).map(a => a[1]);
  const macros = MACROS.filter(m => num(r[m[0]]) !== null);
  const short = diets.filter(d => ['Vegan', 'Vegetarian', 'Pescatarian', 'Halal Protein'].includes(d))
    .map(d => ({ Vegan: 'VG', Vegetarian: 'V', Pescatarian: 'P', 'Halal Protein': 'H' })[d]);
  const body = el('div', { class: 'body' },
    r.ds39818_menuphoto ? el('img', { src: 'data:image/jpeg;base64,' + r.ds39818_menuphoto, alt: '', loading: 'lazy' }) : null,
    diets.length ? el('div', { class: 'tags' }, diets.map(d => el('span', { class: 'tag' }, d))) : null,
    contains.length ? el('div', { class: 'tags' }, el('span', { class: 'mini' }, 'Contains:'), contains.map(a => el('span', { class: 'tag a' }, a))) : null,
    spice ? el('div', {}, 'Spice level ' + spice + ' of 7') : null,
    r.cr24b_additional_x0020_info ? el('div', { class: 'note' }, r.cr24b_additional_x0020_info) : null,
    macros.length ? el('table', { class: 'macros' }, macros.map(m => el('tr', {}, el('td', {}, m[1]), el('td', {}, num(r[m[0]]) + m[2])))) : null,
    r.ds39818_ingredientsrtf ? el('div', { class: 'ingr' }, safeHtml(r.ds39818_ingredientsrtf))
      : r.cr24b_ingredientlist ? el('div', { class: 'ingr' }, r.cr24b_ingredientlist) : null);
  if (!body.childNodes.length) body.append(el('div', { class: 'note' }, 'No details listed.'));
  return el('details', { class: 'item' },
    el('summary', {}, el('span', { class: 'name' }, r.cr24b_item, spice ? el('span', { class: 'mini' }, '🌶'.repeat(Math.min(spice, 3))) : null,
      short.length ? el('span', { class: 'mini' }, short.join(' ')) : null),
      el('span', { class: 'price' }, r.cr24b_price || '')),
    body);
}

function show(data) {
  document.getElementById('lock').remove();
  const app = document.getElementById('app'); app.hidden = false;
  const model = build(data.rows);
  if (!model.dates.includes(state.date)) state.date = model.dates.includes(model.today) ? model.today : model.dates[0];

  const content = el('main', {});
  const chips = (list, key, cls) => el('div', { class: 'row' }, list.map(name => el('button', {
    class: 'chip ' + (cls || ''), 'aria-pressed': String(state[key].includes(name)),
    onclick: ev => { const i = state[key].indexOf(name); if (i < 0) state[key].push(name); else state[key].splice(i, 1);
      ev.target.setAttribute('aria-pressed', String(i < 0)); save(); render(); } }, name)));
  const dateRow = el('div', { class: 'row' }, model.dates.map(d => el('button', { class: 'chip', 'aria-pressed': String(d === state.date),
    onclick: ev => { state.date = d; for (const b of dateRow.children) b.setAttribute('aria-pressed', 'false');
      ev.target.setAttribute('aria-pressed', 'true'); render(); } }, d === model.today ? 'Today' : fmtDate(d))));
  const search = el('input', { type: 'search', placeholder: 'Search dishes or ingredients', oninput: ev => { state.q = ev.target.value.trim().toLowerCase(); render(); } });
  app.append(el('header', {}, el('h1', {}, 'Menu'), dateRow, search,
    el('details', { class: 'filters' }, el('summary', {}, 'Filters'),
      el('div', { class: 'label' }, 'Venues'), chips(VENUE_ORDER, 'venues'),
      el('div', { class: 'label' }, 'Show dishes that are'), chips(DIETS.map(d => d[1]), 'diets'),
      el('div', { class: 'label' }, 'Hide dishes that contain'), chips(ALLERGENS.map(a => a[1]), 'hide', 'hide'))),
    content,
    el('footer', {}, 'Updated ' + new Date(data.exported).toLocaleString() + '. Menus change; check with the café.'));

  function render() {
    content.replaceChildren();
    const items = (model.byDate.get(state.date) || []).filter(x => {
      const r = x.r;
      if (state.venues.length && !state.venues.includes(x.venue)) return false;
      if (/^CLOSED/i.test(r.cr24b_title || '')) return true;
      if (state.diets.length && !DIETS.some(d => state.diets.includes(d[1]) && r[d[0]])) return false;
      if (ALLERGENS.some(a => state.hide.includes(a[1]) && r[a[0]])) return false;
      if (state.q && !((r.cr24b_item || '') + ' ' + (r.cr24b_ingredientlist || '')).toLowerCase().includes(state.q)) return false;
      return true;
    });
    if (!items.length) { content.append(el('div', { class: 'empty' }, 'Nothing matches.')); return; }
    for (const venue of VENUE_ORDER) {
      const vi = items.filter(x => x.venue === venue);
      if (!vi.length) continue;
      const closed = vi.filter(x => /^CLOSED/i.test(x.r.cr24b_title || ''));
      const dishes = vi.filter(x => !closed.includes(x));
      const far = FAR.has(venue);
      if (far && !content.querySelector('.fardiv')) content.append(el('div', { class: 'fardiv' }, 'Farther away'));
      const box = el('details', { class: 'venue' + (far ? ' far' : ''), open: '' },
        el('summary', {}, el('span', {}, venue, far ? el('span', { class: 'farbadge' }, 'longer walk') : null),
          el('span', { class: 'n' }, dishes.length + ' items')));
      for (const c of closed) box.append(el('div', { class: 'closed' }, c.r.cr24b_title + (c.r.cr24b_item ? ' - ' + c.r.cr24b_item : '')));
      const cats = [...new Set(dishes.map(x => x.r.cr24b_title || 'Other'))]
        .sort((a, b) => (CATS.indexOf(a) + 1 || 99) - (CATS.indexOf(b) + 1 || 99));
      for (const cat of cats) {
        box.append(el('div', { class: 'cat' }, cat));
        for (const x of dishes.filter(x => (x.r.cr24b_title || 'Other') === cat)) box.append(itemView(x));
      }
      content.append(box);
    }
  }
  render();
}

if (!PAYLOAD) document.getElementById('err').textContent = 'No menu data in this file.';
else if (!window.crypto || !crypto.subtle || !window.DecompressionStream) document.getElementById('err').textContent = 'This browser is too old to open the menu.';
else start();
</script>
